<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock sign-up form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="left-column">
      <div id="content">
        <div id="strip">
          <div id="logo-wrapper">
            <img src="assets\odin-lined.png" alt="" id="logo" />
          </div>
          <div id="logo-text">Odin</div>
        </div>
      </div>
    </div>

    <div id="right-column">
      <div id="header">
        <p>
          This is not a real online service! You know when you need something
          like this in your life to help you realize your deepest dreams. <br />
          Sign up now to get started.
          <br />
          <br />You know you want to.
        </p>
      </div>
      <div id="main">
        <div id="do_this">Let's do this!</div>
        <div id="container">
          <div class="form-group">
            <label for="first_name">First name</label>
            <input type="text" id="first_name" required />
          </div>

          <div class="form-group">
            <label for="last_name">Last name</label>
            <input type="text" id="last_name" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required />
          </div>

          <div class="form-group">
            <label for="phone_number">Phone number</label>
            <input type="number" id="phone_number" minlength="3" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required />
          </div>

          <div class="form-group">
            <label for="password_confirm">Confirm password</label>
            <input type="password" id="password_confirm" required />
          </div>
        </div>
      </div>
      <div id="footer">
        <button id="submit_button" type="submit">Create account</button>
        <div id="account">
          Already have an account? <span id="login">Log in </span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
